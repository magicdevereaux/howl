[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "howl"
version = "0.1.0"
description = "AI-powered dating app with animal-human hybrid avatars"
requires-python = ">=3.11"
# MUST stay identical to requirements.txt, which is the source of truth for
# installs (CLAUDE.md tells contributors to use `pip install -r requirements.txt`).
# This list previously omitted openai, boto3, sentry-sdk, httpx and pydantic's
# email extra — all imported by the app — so `pip install -e .` produced an app
# that could not start. `test_dependency_manifests_agree` in
# tests/test_packaging.py fails if the two files drift again.
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.14.0",
    "psycopg2-binary>=2.9.0",
    "redis>=5.2.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "celery>=5.4.0",
    "anthropic>=0.40.0",
    "openai>=1.40.0",
    "boto3>=1.35.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "sentry-sdk[fastapi,celery,sqlalchemy]>=2.0.0",
    "pydantic-settings>=2.7.0",
    "pydantic[email]>=2.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "moto[s3]>=5.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
# CI gates on ruff, so this list is deliberately limited to formatting-only rules.
# The bug-catching checks (F401 unused imports, F821 undefined names, I import
# order, UP modernisation) stay enforced everywhere.
ignore = [
    "E501", # line length — 142 hits, almost all seed/test data strings
    "E402", # imports after sys.path setup, intentional in scripts/ and app/api/users.py
    "E702", # multiple statements on one line
    # UP042 wants StrEnum, but these enums back DB enum columns and are read via
    # values_callable. StrEnum changes str() semantics, so migrating them needs a
    # deliberate pass with migration coverage, not an autofix.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# Assigned-but-unused locals in tests are leftover half-written assertions.
# Harmless, but worth cleaning up — see docs/GAPS.md.
"tests/*" = ["F841"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-v"

[tool.coverage.run]
source = ["app"]
omit = [
    "app/migrations/*",
    "alembic/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 1
# Measured at 90.0% on 2026-08-07 (539 tests). Set just below so the gate passes
# on a clean checkout and can be ratcheted up — a gate that fails immediately
# gets disabled instead of fixed. Enforced by the `coverage` CI job, deliberately
# NOT in pytest's addopts: coverage roughly doubles a local run and every
# contributor pays that on every invocation.
fail_under = 88
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.hatch.build.targets.wheel]
packages = ["app"]