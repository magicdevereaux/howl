name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    env:
      # The test suite runs entirely on in-memory SQLite (see tests/conftest.py)
      # and mocks every outbound service, but app.config declares these fields
      # as required, so importing app.main needs them present.
      DATABASE_URL: postgresql://howl:howl_dev@localhost:5433/howl
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-secret-not-used-for-anything-real
      ANTHROPIC_API_KEY: sk-ant-ci-placeholder
      ENVIRONMENT: ci
      DEBUG: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy

      - name: Lint
        run: ruff check app tests scripts

      - name: Test
        run: pytest -q

      # Coverage runs here rather than in pytest's addopts: it roughly doubles a
      # run, and every contributor would pay that on every local invocation.
      # fail_under lives in pyproject.toml [tool.coverage.report] — 88, measured
      # at 90.0%. See docs/GAPS.md #31.
      - name: Coverage gate
        run: pytest -q --cov=app --cov-report=term-missing

  typecheck:
    name: Type check (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true # mypy strict=true is aspirational today — see docs/GAPS.md #27

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy
      - run: mypy app

  mobile:
    name: Mobile typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: mobile
        run: npm install --legacy-peer-deps
      - name: Typecheck
        working-directory: mobile
        run: npx tsc --noEmit
