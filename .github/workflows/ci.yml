name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    # Redis is not mocked centrally (see CLAUDE.md's testing section) — the
    # rate limiter, Celery enqueueing, and ChatPubSub all talk to a real
    # client, with autouse conftest fixtures neutralising the ones that would
    # otherwise hang or leak between tests. Without this service, every one of
    # those connections failed silently into the fail-open path, so real
    # Redis behaviour was never actually exercised in CI (GAPS-ROUND-2 #61).
    #
    # This container is per-job and ephemeral — GitHub Actions starts it fresh
    # for every workflow run and discards it after, so it does not carry the
    # "keys built from ids that repeat" leakage across *runs* that bites local
    # dev (see tests/conftest.py's docstring / howl_test_harness_traps).
    # Leakage *within* one run, between tests that happen to reuse the same
    # id-derived key, is already handled by conftest's existing autouse
    # fixtures. A true per-test-run key prefix would need those fixtures (or
    # the Redis client construction itself) to read one, which means changing
    # tests/conftest.py — out of scope here, see this branch's final report.
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # The test suite runs entirely on in-memory SQLite (see tests/conftest.py)
      # and mocks every outbound service, but app.config declares these fields
      # as required, so importing app.main needs them present.
      DATABASE_URL: postgresql://howl:howl_dev@localhost:5433/howl
      # DB 1, not 0: several fixtures/tests reason about "a" Redis logical DB
      # being exclusively theirs (mirrors the worktree convention of one DB
      # index per concurrent agent/environment); 0 is the default anything
      # unconfigured falls back to, so avoiding it here catches a
      # misconfigured REDIS_URL that silently dropped the path component.
      REDIS_URL: redis://localhost:6379/1
      SECRET_KEY: ci-secret-not-used-for-anything-real
      ANTHROPIC_API_KEY: sk-ant-ci-placeholder
      ENVIRONMENT: ci
      DEBUG: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy

      - name: Lint
        run: ruff check app tests scripts

      - name: Test
        run: pytest -q

      # Coverage runs here rather than in pytest's addopts: it roughly doubles a
      # run, and every contributor would pay that on every local invocation.
      # fail_under lives in pyproject.toml [tool.coverage.report] — 88, measured
      # at 90.0%. See docs/GAPS.md #31.
      - name: Coverage gate
        run: pytest -q --cov=app --cov-report=term-missing

  typecheck:
    name: Type check (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true # mypy strict=true is aspirational today — see docs/GAPS.md #27

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy
      - run: mypy app

  mobile:
    name: Mobile (typecheck, lint, test)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: mobile
        run: npm install --legacy-peer-deps

      # expo-router generates .expo/types/router.d.ts from the filesystem, and
      # it's gitignored, so without this step tsc checks route strings against
      # the permissive `Href` fallback and would NOT catch a bad route path
      # (e.g. router.push('/discvoer')) — see docs/GAPS.md #29. `expo customize`
      # is the non-interactive way to force generation without a dev server;
      # it also (re)writes tsconfig.json, which is a committed no-op here since
      # the checked-in file already matches Expo's template.
      - name: Generate route types
        working-directory: mobile
        run: npx expo customize tsconfig.json

      - name: Typecheck
        working-directory: mobile
        run: npx tsc --noEmit

      - name: Lint
        working-directory: mobile
        run: npm run lint

      - name: Test
        working-directory: mobile
        run: npm test -- --ci

  web:
    name: Web client (lint, test)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test
        working-directory: frontend
        run: npm test

      # A build failure is a real break — the deployed client is built from this.
      - name: Build
        working-directory: frontend
        run: npm run build
